name: Fleetr CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-build:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fleetr/package-lock.json

      - name: Install dependencies
        working-directory: fleetr
        run: npm ci

      - name: Verify TypeScript Compilation (Lint)
        working-directory: fleetr
        run: npm run lint

      - name: Verify Production Bundling (Vite + esbuild)
        working-directory: fleetr
        run: npm run build

      - name: Verify Artifact Output
        run: |
          test -f fleetr/dist/index.html || (echo "Error: Missing fleetr/dist/index.html" && exit 1)
          test -f fleetr/dist/server.cjs || (echo "Error: Missing fleetr/dist/server.cjs" && exit 1)
          echo "Production frontend and backend bundles successfully generated."

  docker-build-verification:
    name: Render Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: fleetr:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
